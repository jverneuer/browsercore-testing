name: build-and-publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: npm install

      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm test -- --coverage

      - name: Enforce >=94% coverage (statements, branches, functions, lines)
        env:
          MINIMUM: "94"
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const s = t.statements.pct, b = t.branches.pct, f = t.functions.pct, l = t.lines.pct;
          const min = parseFloat(process.env.MINIMUM);
          const failed = [['statements',s],['branches',b],['functions',f],['lines',l]].filter(([,p])=>p<min);
          if (failed.length) {
            console.error('Coverage below '+min+'% threshold:');
            for (const [k,p] of failed) console.error('  '+k+' '+p+'% < '+min+'%');
            process.exit(1);
          }
          console.log('Coverage OK — statements '+s+'%, branches '+b+'%, functions '+f+'%, lines '+l+'% >= '+min+'%');
          "

      - name: Generate badge
        run: |
          node -e "
          const fs = require('fs');
          const t = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total;
          const pct = t.statements.pct;
          const color = pct >= 90 ? 'brightgreen' : pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red';
          const badge = { schemaVersion: 1, label: 'coverage', message: pct+'%', color, namedLogo: 'vitest' };
          fs.mkdirSync('.github', { recursive: true });
          fs.writeFileSync('.github/coverage-badge.json', JSON.stringify(badge));
          "

      - run: npm run build

      - name: Detect version change
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          PARENT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "")
          if [ -z "$PARENT" ]; then
            CHANGED="true"
          else
            PREVIOUS=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              CHANGED="true"
            else
              CHANGED="false"
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Version $CURRENT (previous: ${PREVIOUS:-<none>}) — changed: $CHANGED"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .github/coverage-badge.json

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
